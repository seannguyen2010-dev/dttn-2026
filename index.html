<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ĐTTN 2026 - Điều tra hộ</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:16px;font-weight:700;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.9;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.sync-indicator{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15);margin-left:6px}
.sync-indicator .dot{width:7px;height:7px;border-radius:50%;background:#94a3b8}
.sync-indicator.synced .dot{background:#4ade80}
.sync-indicator.syncing .dot{background:#fbbf24;animation:pulse 1s infinite}
.sync-indicator.error .dot{background:#ef4444}
.sync-indicator.offline .dot{background:#94a3b8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.progress-bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:#4ade80;border-radius:3px;transition:width .3s}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:90}
.tab{flex:0 0 auto;padding:12px 14px;font-size:13px;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;color:#64748b;font-weight:500}
.tab.active{border-bottom-color:#3b82f6;color:#1e40af;font-weight:700}
.tab .badge{display:inline-block;background:#e2e8f0;border-radius:10px;padding:0 6px;font-size:11px;margin-left:3px}
.tab.active .badge{background:#dbeafe;color:#1e40af}
.toolbar{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e2e8f0}
.search-box{flex:1 1 140px;position:relative}
.search-box input{width:100%;padding:10px 12px 10px 34px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc;outline:none}
.search-box input:focus{border-color:#3b82f6;background:#fff}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px}
select.filter{padding:10px 8px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;background:#f8fafc;outline:none;max-width:150px}
.btn{padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-warn{background:#f59e0b;color:#fff}
.btn-secondary{background:#f1f5f9;color:#475569}
.btn-block{width:100%;justify-content:center}
.stats-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.stat-chip{flex:0 0 auto;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.s1{background:#dcfce7;color:#166534}.s0{background:#fee2e2;color:#991b1b}.s2{background:#fef3c7;color:#92400e}.s3{background:#ede9fe;color:#5b21b6}.stotal{background:#e0e7ff;color:#3730a3}
.list{padding:10px 12px 100px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;cursor:pointer;border-left:4px solid #cbd5e1;transition:box-shadow .15s,background .15s}
.card:active{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.card.status-0{border-left-color:#ef4444;opacity:.8}
.card.status-1{border-left-color:#22c55e}
.card.status-2{border-left-color:#f59e0b}
.card.status-3{border-left-color:#8b5cf6}
.card.selected{background:#fef2f2;opacity:1;box-shadow:0 0 0 2px #ef4444 inset}
.card-num{width:38px;height:38px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#64748b;flex-shrink:0}
.card-body{flex:1;min-width:0}
.card-name{font-weight:600;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:12px;color:#64748b;display:flex;gap:10px;flex-wrap:wrap}
.card-badges{display:flex;gap:4px;margin-top:4px}
.badge-done{background:#dcfce7;color:#166534;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600}
.badge-progress{background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600}
.badge-nosurvey{background:#fee2e2;color:#991b1b;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600}
.card-del{width:40px;height:40px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;transition:all .15s}
.card-del:active{transform:scale(.9)}
.card-del.on{background:#ef4444;border-color:#ef4444;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:600px;max-height:95vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s ease;display:flex;flex-direction:column}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{position:sticky;top:0;background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;z-index:10;gap:10px}
.modal-header .titles{flex:1;min-width:0}
.modal-header h2{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-header .income{font-size:12px;color:#166534;font-weight:600;margin-top:2px}
.modal-close{width:34px;height:34px;border-radius:50%;border:none;background:#f1f5f9;font-size:18px;cursor:pointer;color:#64748b;flex-shrink:0}
.modal-body{padding:14px 16px 90px;overflow-y:auto;flex:1}
.modal-footer{position:sticky;bottom:0;background:#fff;padding:12px 16px;border-top:1px solid #e2e8f0;display:flex;gap:10px;z-index:10}
.modal-footer .btn{flex:1;justify-content:center;padding:12px;font-size:15px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:15px;background:#f8fafc;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#3b82f6;background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.survey-section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
.survey-section-header{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;background:#f8fafc;user-select:none}
.survey-section-header.open{background:#eff6ff;border-bottom:1px solid #dbeafe}
.survey-section-header .num{width:26px;height:26px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.survey-section-header .title{flex:1;font-weight:700;font-size:14px;color:#1e293b}
.survey-section-header .arrow{color:#94a3b8;font-size:16px;transition:transform .2s}
.survey-section-header.open .arrow{transform:rotate(90deg)}
.survey-section-body{display:none;padding:14px}
.survey-section-body.open{display:block}
.member-card,.job-card{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
.member-header,.job-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.member-header b,.job-header b{font-size:13px;color:#334155}
.btn-icon{background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer}
.empty-small{text-align:center;padding:16px;color:#94a3b8;font-size:13px;background:#f8fafc;border-radius:8px;margin-bottom:8px}
.totals-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:10px;padding:12px;margin:10px 0;font-size:13px}
.totals-box .row{display:flex;justify-content:space-between;padding:3px 0}
.totals-box .row.total{font-weight:700;font-size:15px;color:#1e40af;padding-top:8px;margin-top:6px;border-top:1.5px dashed #93c5fd}
.totals-box .row.pc{font-weight:700;font-size:14px;color:#166534;background:#dcfce7;margin:8px -12px -12px;padding:10px 12px;border-radius:0 0 10px 10px}
.sel-bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;color:#fff;padding:10px 14px;display:none;align-items:center;gap:8px;z-index:150;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
.sel-bar.show{display:flex}
.sel-bar .info{flex:1;font-size:13px;line-height:1.3}
.sel-bar .info b{color:#fca5a5;font-size:16px}
.sel-bar .btn{padding:9px 12px;font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;font-weight:500;z-index:400;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fab{position:fixed;bottom:20px;right:18px;width:56px;height:56px;border-radius:50%;background:#3b82f6;color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.fab:active{transform:scale(.9)}
.empty{text-align:center;padding:50px 20px;color:#94a3b8;font-size:14px}
.empty-icon{font-size:44px;margin-bottom:10px}
@media(min-width:640px){.list{max-width:640px;margin:0 auto}.fab{right:calc(50% - 320px + 18px)}}
</style>
</head>
<body>

<div class="header">
  <h1>ĐTTN 2026 — Thu thập thông tin hộ</h1>
  <div class="sub">
    <span id="headerSub">Đang tải...</span>
    <span class="sync-indicator offline" id="syncIndicator">
      <span class="dot"></span><span id="syncText">Chưa kết nối</span>
    </span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <div class="search-box"><input type="search" id="search" placeholder="Tìm tên chủ hộ..."></div>
  <select class="filter" id="statusFilter">
    <option value="">Tất cả</option>
    <option value="0">0 - Không còn</option>
    <option value="1">1 - Đang ở</option>
    <option value="2">2 - Hộ mới</option>
    <option value="3">3 - HSSV</option>

  <button class="btn btn-warn" id="syncBtn" title="Tải lại dữ liệu mới nhất từ Firebase">🔄 Đồng bộ</button>
  <button class="btn btn-danger" id="deleteStatus0Btn" title="Xóa tất cả hộ trạng thái 0">🗑 Xóa hết hộ không điều tra</button>
  <button class="btn btn-success" id="exportBtn">📤 Xuất bảng kê</button>
  <button class="btn btn-primary" id="exportDetailBtn">📊 Xuất chi tiết</button>
</div>

<div class="stats-bar" id="statsBar"></div>
<div class="list" id="list"></div>
<button class="fab" id="fabAdd" title="Thêm hộ mới">+</button>

<div class="sel-bar" id="selBar">

  <button class="btn btn-secondary" id="selClearBtn">Bỏ chọn</button>
  <button class="btn btn-danger" id="selDeleteBtn">🗑 Xóa</button>
</div>

<div class="overlay" id="surveyOverlay">
  <div class="modal" id="surveyModal">
    <div class="modal-header">
      <div class="titles">
        <h2 id="surveyTitle">-</h2>
        <div class="income" id="surveyIncome"></div>
      </div>
      <button class="modal-close" id="surveyClose">✕</button>
    </div>
    <div class="modal-body" id="surveyBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="surveyDoneBtn">✅ Hoàn thành</button>
      <button class="btn btn-primary" id="surveySaveBtn">💾 Lưu</button>
    </div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal" style="max-height:90vh">
    <div class="modal-header">
      <h2>➕ Thêm hộ mới</h2>
      <button class="modal-close" onclick="document.getElementById('addOverlay').classList.remove('show')">✕</button>
    </div>
    <div class="modal-body" style="padding-bottom:16px">
      <div class="form-group"><label>STT nhà (4 ký tự)</label><input id="newStt" maxlength="6"></div>
      <div class="form-group"><label>Họ và tên chủ hộ *</label><input id="newName" placeholder="Nhập họ tên..."></div>
      <div class="form-group"><label>Địa chỉ</label><input id="newAddr"></div>
      <div class="form-row">
        <div class="form-group"><label>Số NKTTTT</label><input id="newTotal" type="number" min="0" value="0"></div>
        <div class="form-group"><label>Trong đó Nữ</label><input id="newFemale" type="number" min="0" value="0"></div>
      </div>
      <div class="form-group"><label>Trạng thái</label>
        <select id="newStatus">
          <option value="1">1 - Hộ đang ở</option>

    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================================================================ */
/* CẤU HÌNH FIREBASE                                                 */
/* ================================================================ */
const firebaseConfig = {
  apiKey:            "AIzaSyDVv2oS3MWbJsVl4MW_XyZoadKtW2vu0hc",
  authDomain:        "dttn-2026.firebaseapp.com",
  databaseURL:       "https://dttn-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "dttn-2026",
  storageBucket:     "dttn-2026.firebasestorage.app",
  messagingSenderId: "229245298763",
  appId:             "1:229245298763:web:85983a9b1180561ca905ce"
};

let db = null;
let firebaseReady = false;
let firebaseListenerOn = false;

try {
  if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_')) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    try { db.setPersistenceEnabled(true); } catch(e){}
    firebaseReady = true;
    console.log('✅ Firebase đã sẵn sàng');
    updateSyncIndicator('ready', 'Sẵn sàng');
  } else {
    console.warn('⚠️ Firebase chưa cấu hình — chỉ lưu offline');
    updateSyncIndicator('offline', 'Offline');
  }
} catch(err) {
  console.error('❌ Lỗi Firebase:', err);
  updateSyncIndicator('error', 'Lỗi cấu hình');
}

function updateSyncIndicator(state, text){
  const el = document.getElementById('syncIndicator');
  const txt = document.getElementById('syncText');
  if(!el || !txt) return;
  el.className = 'sync-indicator ' + state;
  txt.textContent = text;
}

/* Đẩy dữ liệu lên Firebase — trả về Promise để chờ xác nhận */
function saveToFirebase(){
  return new Promise((resolve, reject)=>{
    if(!firebaseReady || !db){ resolve(false); return; }
    updateSyncIndicator('syncing', 'Đang gửi...');
    db.ref('dttn2026_data').set(households)
      .then(()=>{
        updateSyncIndicator('synced', 'Đã đồng bộ');
        console.log('✅ Đã đẩy dữ liệu lên Firebase');
        resolve(true);
      })
      .catch(err=>{
        updateSyncIndicator('error', 'Lỗi đồng bộ');
        console.error('❌ Lỗi đẩy Firebase:', err);
        reject(err);
      });
  });
}

/* Tải toàn bộ dữ liệu mới nhất từ Firebase (ghi đè local) */
function loadFromFirebase(silent){
  return new Promise((resolve, reject)=>{
    if(!firebaseReady || !db){ resolve(false); return; }
    if(!silent) updateSyncIndicator('syncing', 'Đang tải...');
    db.ref('dttn2026_data').once('value')
      .then(snap=>{
        const data = snap.val();
        if(!data){
          if(!silent) toast('ℹ️ Firebase chưa có dữ liệu');
          updateSyncIndicator('synced', 'Trống');
          resolve(false); return;
        }
        households = data;
        Object.keys(AREAS).forEach(code=>{
          if(!households[code]) households[code] = parseArea(code);
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(households));
        renderAll();
        updateSyncIndicator('synced', 'Đã tải về');
        if(!silent) toast('✅ Đã tải dữ liệu mới nhất từ Firebase');
        resolve(true);
      })
      .catch(err=>{
        updateSyncIndicator('error', 'Lỗi tải');
        console.error('❌ Lỗi tải Firebase:', err);
        if(!silent) toast('❌ Không thể tải: ' + err.message);
        reject(err);
      });
  });
}

/* Lắng nghe thay đổi realtime — khi thiết bị khác sửa, máy này tự cập nhật */
function startRealtimeListener(){
  if(!firebaseReady || !db || firebaseListenerOn) return;
  firebaseListenerOn = true;
  db.ref('dttn2026_data').on('value', snap=>{
    const data = snap.val();
    if(!data) return;
    const newStr = JSON.stringify(data);
    if(newStr === JSON.stringify(households)) return;
    households = data;
    Object.keys(AREAS).forEach(code=>{
      if(!households[code]) households[code] = parseArea(code);
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(households));
    renderAll();
    updateSyncIndicator('synced', 'Đã đồng bộ');
  });
}

const AREAS = {

"0021|A Nhan|4|3|1","0022|A Nhẹ|1||1","0023|Y Vạc|2|2|1","0024|A Nhoái|3|1|1","0025|A Nao|4|1|1",
"0026|A Nhiêm|5|2|1","0027|A Nhang|1|1|1","0028|A Hấy|5|3|1","0029|A Lách|7|1|1","0030|A Reo|5|1|1",
"0031|A Khoa|6||1","0032|A Đấy|4|2|1","0033|Y Bả|4|1|1","0034|A Nhoài|1|1|1","0035|A Đa (Y Linh)|1|1|1",
"0036|Y Bấu|4|1|1","0037|A Núi|3|1|1","0038|Y Vía|1|1|1","0039|Y Liên|3|2|1","0040|A Dum|3||1",
"0041|y nhai|5|1|1","0042|Y Viết|2|1|1","0043|A Blam|5|1|1","0044|Đặng (Trần) Văn Hoàng|1||1","0045|Y Đường|3|3|1",
